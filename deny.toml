[graph]
targets = []
# The two ONNX Runtime provisioning strategies pull disjoint dependency subtrees:
# ort-bundled brings the build-time downloader and its TLS stack, ort-dynamic brings the
# dylib loader, and tract brings a pure-Rust ONNX stack. Only the default graph was ever
# audited, so a licence or advisory issue could hide in whichever strategy was not the
# default. Auditing all features covers every subtree a user can build. ~keep
all-features = true
no-default-features = false

[output]
feature-depth = 1

[advisories]
# RUSTSEC-2024-0436: `paste` is unmaintained, not vulnerable — its author retired it and
# points at forks. It reaches this workspace only through candle-core -> gemm, is a
# compile-time proc-macro with no runtime surface, and nothing here depends on it directly.
# Drop this entry when gemm migrates to a maintained fork. ~keep
ignore = [
  "RUSTSEC-2024-0436",
  # Candle 0.11.0 is the only user of zip 8.6.0 in this graph. Its NPZ/pickle loaders ~keep
  # read entries without extracting them, and Sceptre loads ONNX initializers through prost. ~keep
  # These three advisories affect filesystem extraction APIs, which neither calls. ~keep
  # Remove these exceptions when a published Candle release adopts zip >=9.0.0. ~keep
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "Zlib",
  "Unlicense",
  "CC0-1.0",
  "Unicode-3.0",
  "BSL-1.0",
  "0BSD",
  "Unicode-DFS-2016",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
