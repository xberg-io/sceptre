name: Verify published CLI runtimes

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version to verify without rebuilding or publishing
        type: string
        required: true
        default: "0.8.1"

permissions:
  contents: read

jobs:
  native-runtime:
    name: Published OCR (${{ matrix.triple }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
          - os: macos-15
            triple: aarch64-apple-darwin
          - os: windows-2025
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TRIPLE: ${{ matrix.triple }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: python task
      - name: Test the published-release verifier
        run: task release:verify:test
      - name: Cache immutable verified model snapshots
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/sceptre-published-models
          key: sceptre-published-models-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/verify_published_release.py') }}
      - name: Verify downloaded release through native MCP OCR
        shell: bash
        env:
          RELEASE_OUTPUT: ${{ runner.temp }}/sceptre-published-proof
          RELEASE_MODEL_CACHE: ${{ runner.temp }}/sceptre-published-models
        run: task release:verify:published
      - name: Preserve actual protocol, runtime and checksum evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: published-runtime-${{ matrix.triple }}-${{ github.run_id }}
          path: ${{ runner.temp }}/sceptre-published-proof
          if-no-files-found: error
          retention-days: 14
