name: Release

on:
  push:
    tags: ["v[0-9]+.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.1.0)"
        required: true
        type: string

concurrency:
  # Key on the resolved tag, not github.ref: a tag push (refs/tags/vX) and a manual rerun ~keep
  # for the SAME tag carry different refs and would otherwise race. Never cancel a release ~keep
  # mid-flight — asset uploads and the crates.io dry-run should complete deterministically. ~keep
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_complete: ${{ steps.assets.outputs.release_complete }}
      crates_exists: ${{ steps.published.outputs.crates_exists }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Extract version from tag
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          version="${tag#v}"
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "Tag: $tag / version: $version"

      - name: Verify the workspace version matches the tag
        run: |
          set -euo pipefail
          target="${{ steps.version.outputs.version }}"
          cargo_version="$(grep -E '^version = "' Cargo.toml | head -1 | cut -d'"' -f2)"
          if [ "$cargo_version" != "$target" ]; then
            echo "::error::Cargo.toml [workspace.package].version ($cargo_version) does not match tag ($target)"
            exit 1
          fi
          echo "Workspace version matches tag: $target"

      # Cargo.toml pins the sceptre-cli -> sceptre dependency version separately in
      # [workspace.dependencies], so a version bump that only touches [workspace.package]
      # would ship a CLI that still resolves an old sceptre from crates.io. Fail loudly
      # rather than let that divergence reach a release. ~keep
      - name: Verify the sceptre dependency pin matches the workspace version
        run: |
          set -euo pipefail
          target="${{ steps.version.outputs.version }}"
          dep_version="$(grep -E '^sceptre = \{ path = "crates/sceptre"' Cargo.toml | grep -oE 'version = "[^"]+"' | head -1 | cut -d'"' -f2)"
          if [ -z "$dep_version" ]; then
            echo "::error::Could not find [workspace.dependencies].sceptre version pin in Cargo.toml"
            exit 1
          fi
          if [ "$dep_version" != "$target" ]; then
            echo "::error::[workspace.dependencies].sceptre version ($dep_version) does not match [workspace.package].version ($target)"
            exit 1
          fi
          echo "sceptre dependency pin matches workspace version: $target"

      - name: Detect an already-published crates.io version
        id: published
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          crates_exists=false
          # sceptre-cli is published last (it depends on sceptre), so its presence at this ~keep
          # version means the whole set is already on crates.io — the job can be skipped. ~keep
          # crates.io answers 403 to a request carrying no User-Agent, which a bare `curl -f` ~keep
          # reads as "absent" for every version, so identify the caller and match on 200. ~keep
          # A 403/5xx/timeout leaves this false, which only costs an idempotent re-publish. ~keep
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: sceptre release workflow (https://github.com/xberg-io/sceptre)' \
            "https://crates.io/api/v1/crates/sceptre-cli/${version}" || echo 000)"
          echo "crates.io HTTP $status for sceptre-cli ${version}"
          if [ "$status" = "200" ]; then
            crates_exists=true
          fi
          echo "crates_exists=$crates_exists" >> "$GITHUB_OUTPUT"
          echo "crates.io already has sceptre-cli ${version}? $crates_exists"

      - name: Detect a COMPLETE existing release (all archives + checksums)
        id: assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          release_complete=false
          # Treat the release as done only when the FULL asset set is present. A partial
          # draft (a builder failed or was cancelled) reports false so create-release + the
          # build matrix rerun and heal the gaps on a re-dispatch of the same tag. ~keep
          required=(
            "sceptre-x86_64-unknown-linux-gnu.tar.gz"
            "sceptre-aarch64-unknown-linux-gnu.tar.gz"
            "sceptre-aarch64-apple-darwin.tar.gz"
            "sceptre-x86_64-pc-windows-msvc.zip"
            "sceptre_${version}_checksums.txt"
          )
          if gh release view "$tag" --json assets -q '.assets[].name' > /tmp/have.txt 2>/dev/null; then
            missing=0
            for asset in "${required[@]}"; do
              grep -qx "$asset" /tmp/have.txt || { echo "  missing: $asset"; missing=$((missing + 1)); }
            done
            [ "$missing" -eq 0 ] && release_complete=true
          fi
          echo "release_complete=$release_complete" >> "$GITHUB_OUTPUT"
          echo "Complete release already present? $release_complete"

  create-release:
    name: Create draft release
    needs: meta
    if: needs.meta.outputs.release_complete != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Determine prerelease flag
        id: prerelease
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"
          prerelease=false
          case "$tag" in
            *-rc.* | *-beta* | *-alpha*) prerelease=true ;;
          esac
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      # `finalize-release` only flips the draft flag — it has no notes input — so whatever
      # body is set here is what ships. Without this the release published as a bare
      # "Release vX.Y.Z" with none of the changelog. `generate-notes` is not a substitute:
      # it lists raw commit subjects, and CHANGELOG.md is the curated, ADR-linked record. ~keep
      - name: Extract the changelog section for this tag
        id: notes
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          body="$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/       { exit }
            found                   { print }
          ' CHANGELOG.md)"
          # A release whose notes silently degrade to a bare tag is the defect this step
          # exists to prevent, so an unmatched heading fails loudly instead. ~keep
          if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section to publish as release notes."
            exit 1
          fi
          {
            echo "body<<SCEPTRE_NOTES_EOF"
            printf '%s\n' "$body"
            echo "**Full changelog:** https://github.com/${{ github.repository }}/blob/${TAG}/CHANGELOG.md"
            echo "SCEPTRE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # Create as a DRAFT: the build matrix uploads binaries to it, but it stays hidden
      # until finalize promotes it — and finalize only runs once checksums (which requires
      # all platform binaries) succeeds. A failed platform build leaves a hidden draft, not
      # a live release with missing binaries (ADR 0020). Idempotent: an existing draft is
      # left untouched, so a re-dispatch of the same tag never re-creates or un-drafts it. ~keep
      - name: Ensure a draft release exists
        uses: xberg-io/actions/publish-github-release@v1
        with:
          tag: ${{ needs.meta.outputs.tag }}
          title: ${{ needs.meta.outputs.tag }}
          notes: ${{ steps.notes.outputs.body }}
          draft: "true"
          prerelease: ${{ steps.prerelease.outputs.prerelease }}

  build:
    name: Build ${{ matrix.triple }}
    needs: [meta, create-release]
    if: needs.meta.outputs.release_complete != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - triple: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - triple: aarch64-apple-darwin
            os: macos-latest
          # No x86_64-apple-darwin: ort's `download-binaries` ships no prebuilt ONNX Runtime
          # for Intel macOS, so a self-contained build is impossible. Apple Silicon covers
          # macOS; Intel-mac users build from source. ~keep
          - triple: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.triple }}
          install-llvm-cov: "false"
          cache-key-prefix: release-build-${{ matrix.triple }}

      # Install `task` so the workflow calls task targets, not raw cargo, per the
      # pipeline-standards task-runner rule. ~keep
      - uses: xberg-io/actions/install-task@v1

      - name: Set up Python for release smoke checks
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Verify the release smoke gate
        run: task rust:release:smoke:test

      - name: Build and package
        shell: bash
        run: task release:package TRIPLE=${{ matrix.triple }}

      - name: Smoke-test the packaged binary
        shell: bash
        run: task rust:release:smoke TRIPLE=${{ matrix.triple }} VERSION=${{ needs.meta.outputs.version }}

      - name: Upload archive to the release
        uses: xberg-io/actions/upload-release-assets@v1
        with:
          tag: ${{ needs.meta.outputs.tag }}
          assets: sceptre-${{ matrix.triple }}.*

  checksums:
    name: Generate checksums
    needs: [meta, build]
    if: needs.meta.outputs.release_complete != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
      - name: Verify all platform archives are present, then checksum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"
          version="${{ needs.meta.outputs.version }}"
          expected=(
            "sceptre-x86_64-unknown-linux-gnu.tar.gz"
            "sceptre-aarch64-unknown-linux-gnu.tar.gz"
            "sceptre-aarch64-apple-darwin.tar.gz"
            "sceptre-x86_64-pc-windows-msvc.zip"
          )
          gh release view "$tag" --json assets -q '.assets[].name' > /tmp/have.txt || true
          missing=0
          for asset in "${expected[@]}"; do
            grep -qx "$asset" /tmp/have.txt || { echo "::error::missing $asset"; missing=$((missing + 1)); }
          done
          [ "$missing" -eq 0 ] || { echo "::error::release incomplete ($missing archives missing)"; exit 1; }

          for asset in "${expected[@]}"; do
            gh release download "$tag" -p "$asset" -O "$asset"
          done
          sha256sum sceptre-*.tar.gz sceptre-*.zip | sort > "sceptre_${version}_checksums.txt"
          cat "sceptre_${version}_checksums.txt"

      - name: Upload checksums to the release
        uses: xberg-io/actions/upload-release-assets@v1
        with:
          tag: ${{ needs.meta.outputs.tag }}
          assets: sceptre_${{ needs.meta.outputs.version }}_checksums.txt

  finalize:
    name: Publish GitHub release
    needs: [meta, checksums]
    if: always() && needs.meta.result == 'success' && needs.meta.outputs.release_complete != 'true' && needs.checksums.result == 'success'
    runs-on: ubuntu-latest
    steps:
      # A hard gate before promotion: never un-draft a release missing an asset (ADR 0020).
      # `finalize-release` itself only flips the draft flag, so completeness is verified here
      # first, independently of `meta`'s own idempotency-only completeness probe. ~keep
      - name: Verify every release asset is present
        uses: xberg-io/actions/verify-release-assets@v1
        with:
          tag: ${{ needs.meta.outputs.tag }}
          min-size-bytes: "1"
          expected-assets: |
            sceptre-x86_64-unknown-linux-gnu.tar.gz
            sceptre-aarch64-unknown-linux-gnu.tar.gz
            sceptre-aarch64-apple-darwin.tar.gz
            sceptre-x86_64-pc-windows-msvc.zip
            sceptre_${{ needs.meta.outputs.version }}_checksums.txt

      - name: Promote the draft once every asset is present
        uses: xberg-io/actions/finalize-release@v1
        with:
          tag: ${{ needs.meta.outputs.tag }}

  publish-crates:
    name: Publish to crates.io
    needs: [meta, finalize]
    # crates.io is irreversible, so publish source only after the platform binaries built
    # and the GitHub release promoted — keeping the surfaces atomic across a partial failure
    # (ADR 0023). Skipped when this version is already on crates.io (idempotent re-runs).
    #
    # This job's steps MUST stay inline in this file, not behind a reusable workflow call:
    # crates.io Trusted Publishing binds the OIDC `job_workflow_ref` claim to this exact
    # workflow file, and delegating the job body elsewhere would break that trust. ~keep
    if: always() && needs.meta.outputs.crates_exists != 'true' && needs.finalize.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - uses: xberg-io/actions/setup-rust@v1
        with:
          install-llvm-cov: "false"
          cache-key-prefix: release-publish-crates

      - name: Pre-warm the default-feature build before the irreversible step
        # `cargo publish -p sceptre-cli` runs a verification build with DEFAULT features,
        # which is `ort-bundled` — so it fetches an ONNX Runtime prebuilt from cdn.pyke.io
        # partway through publishing, after the GitHub release has already been promoted.
        # A CDN outage there strands the release half-published and unrecoverable.
        # `publish-crates` has no `--no-default-features` input, so this build cannot be
        # eliminated — only pre-warmed, so the same fetch during `cargo publish`'s own
        # verification build is cached and fast rather than a fresh, failure-prone one. ~keep
        run: cargo build -p sceptre-cli --locked

      # Handles crates.io OIDC auth, dependency-ordered publishing, index-propagation waits,
      # and idempotent skipping of an already-published version internally. ~keep
      - name: Publish sceptre then sceptre-cli (dependency order)
        uses: xberg-io/actions/publish-crates@v1
        with:
          crates: sceptre sceptre-cli
          version: ${{ needs.meta.outputs.version }}

  publish-plugin-artifacts:
    name: Publish all plugin runtime artifacts
    needs: [meta, finalize]
    if: always() && needs.meta.result == 'success' && (needs.finalize.result == 'success' || needs.meta.outputs.release_complete == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
          fetch-depth: 0
      - name: Install ai-rulez
        uses: xberg-io/actions/setup-ai-rulez@98adf87f1ed4c62a57ff56f9010d62faf42d4db6
        with:
          ai-rulez-version: "5.3.0"
          source-revision: "12aa1103ddfb1baf1a439df5b479b0129bba27c1"
      - name: Verify public skill exports
        run: python3 scripts/sync_public_skills.py --check
      - name: Package all supported plugin runtimes
        uses: xberg-io/actions/package-ai-rulez-plugin@66e9a172c28ae7e57496fe92de1ab74f2a604194
        with:
          cursor-marketplace: "true"
          tag: ${{ needs.meta.outputs.tag }}
          config-directory: .ai-rulez
          version-sync-script: scripts/sync_plugin_version.py
      - name: Archive verified runtime bundles and marketplace indexes
        shell: bash
        env:
          PLUGIN_TAG: ${{ needs.meta.outputs.tag }}
          PLUGIN_PRODUCT: sceptre
        run: |
          set -euo pipefail
          test -n "$PLUGIN_TAG"
          bundle="dist/${PLUGIN_PRODUCT}-plugins-${PLUGIN_TAG//\//-}.tar.gz"
          tar --sort=name --mtime="@$(git show -s --format=%ct HEAD)" \
            --owner=0 --group=0 --numeric-owner -cf - -C dist/plugin . | gzip -n > "$bundle"
          (cd dist && sha256sum "$(basename "$bundle")") > "$bundle.sha256"
      - name: Attach verified plugin archive and metadata
        uses: xberg-io/actions/upload-release-assets@v1
        with:
          tag: ${{ needs.meta.outputs.tag }}
          assets: |
            dist/*-plugins-*.tar.gz
            dist/*-plugins-*.tar.gz.sha256

  publish-plugin-opencode:
    name: Publish OpenCode and Pi plugin to npm
    needs: [meta, finalize]
    if: always() && needs.meta.result == 'success' && (needs.finalize.result == 'success' || needs.meta.outputs.release_complete == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
      - name: Install ai-rulez
        uses: xberg-io/actions/setup-ai-rulez@98adf87f1ed4c62a57ff56f9010d62faf42d4db6
        with:
          ai-rulez-version: "5.3.0"
          source-revision: "12aa1103ddfb1baf1a439df5b479b0129bba27c1"
      - name: Verify plugin versions and generated resources before publishing
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/sync_plugin_version.py --expect "$VERSION"
          python3 scripts/sync_public_skills.py --check
          ai-rulez verify --plugin
      - name: Verify packed OpenCode and Pi resources
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="$(mktemp -d)"
          npm pack ./plugin --ignore-scripts --json --pack-destination "$pack_dir" > "$pack_dir/pack.json"
          node - "$pack_dir/pack.json" <<'NODE'
          const fs = require('node:fs');
          const pkg = require('./plugin/package.json');
          const packed = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (packed.length !== 1) throw new Error('Expected exactly one packed plugin');
          const files = packed[0].files.map(file => file.path);
          if (!files.includes(pkg.exports['.'].replace(/^\.\//, ''))) {
            throw new Error('OpenCode entry point was not packed');
          }
          if (!pkg.keywords.includes('pi-package') || !pkg.pi.skills.length) {
            throw new Error('Missing Pi package metadata');
          }
          for (const resource of [...pkg.pi.skills, ...pkg.pi.prompts]) {
            const relative = resource.replace(/^\.\//, '').replace(/\/$/, '');
            if (!files.some(path => path === relative || path.startsWith(`${relative}/`))) {
              throw new Error(`Declared Pi resource was not packed: ${resource}`);
            }
          }
          console.log(`Verified ${files.length} packed files and ${pkg.pi.skills.length} Pi skills`);
          NODE
      - name: Publish verified npm package
        uses: xberg-io/actions/publish-npm@v1
        with:
          expected-version: ${{ needs.meta.outputs.version }}
          package-dir: plugin
          access: public
          npm-tag: ${{ contains(needs.meta.outputs.version, '-') && 'next' || 'latest' }}
          provenance: "true"

  publish-plugin-hermes:
    name: Publish Hermes plugin to PyPI
    needs: [meta, finalize]
    if: always() && needs.meta.result == 'success' && (needs.finalize.result == 'success' || needs.meta.outputs.release_complete == 'true')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
          fetch-depth: 0
      - name: Install ai-rulez
        uses: xberg-io/actions/setup-ai-rulez@98adf87f1ed4c62a57ff56f9010d62faf42d4db6
        with:
          ai-rulez-version: "5.3.0"
          source-revision: "12aa1103ddfb1baf1a439df5b479b0129bba27c1"
      - name: Verify plugin versions and generated resources before publishing
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/sync_plugin_version.py --expect "$VERSION"
          python3 scripts/sync_public_skills.py --check
          ai-rulez verify --plugin
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
      - name: Read the verified Hermes package version
        id: wheel-version
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path('plugin/.hermes/package/pyproject.toml').read_text())['project']
          if project['name'] != 'sceptre-hermes-plugin' or not project['version']:
              raise SystemExit('Missing or unexpected Hermes package identity')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"version={project['version']}\n")
          PY
      - name: Build Hermes wheel
        run: uv build --wheel --out-dir dist-hermes plugin/.hermes/package
      - name: Publish verified Hermes wheel
        uses: xberg-io/actions/publish-pypi@v1
        with:
          expected-version: ${{ steps.wheel-version.outputs.version }}
          packages-dir: dist-hermes

  plugin-release-report:
    name: Verify all plugin distribution jobs succeeded
    needs: [publish-plugin-artifacts, publish-plugin-opencode, publish-plugin-hermes]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Reject failed or skipped plugin distribution
        env:
          RESULTS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = json.loads(os.environ['RESULTS_JSON'])
          expected = {'publish-plugin-artifacts', 'publish-plugin-opencode', 'publish-plugin-hermes'}
          if set(results) != expected:
              raise SystemExit('Expected exactly three plugin distribution jobs')
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit(f"Incomplete plugin distribution: {', '.join(failed)}")
          print('Verified 3/3 plugin distribution jobs succeeded')
          PY
