name: Shell contracts
on:
  push:
    branches: [main]
    paths: ["scripts/**", "tests/**", "mise.toml", ".github/workflows/test-shell.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/install-bats@v1
        with:
          version: "1.14.0"
      - uses: xberg-io/actions/run-bats@v1
        with:
          path: tests/bats
          lib-path: tests/lib
          args: --print-output-on-failure
      - name: Verify pinned shared helpers
        run: BATS_LIB_REF=v1.29.0 bash scripts/sync-bats-lib.sh --check
