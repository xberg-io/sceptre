name: CI Plugin

on:
  push:
    branches: [main]
    paths:
      - "plugin/**"
      - "skills/**"
      - "scripts/sync_public_skills.py"
      - "scripts/tests/test_public_skills.py"
      - ".ai-rulez/config*.toml"
      - ".claude-plugin/**"
      - ".agents/plugins/**"
      - "Cargo.toml"
      - "scripts/sync_plugin_version.py"
      - ".github/workflows/ci-plugin.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ~keep ai-rulez runs at its latest release, never a mise pin (org ADR-0015).
      - name: Install ai-rulez
        uses: xberg-io/actions/setup-ai-rulez@v1
      - uses: xberg-io/actions/verify-ai-rulez-plugin@v1
        with:
          config-directory: .ai-rulez

      - name: Install uv for Hermes contract tests
        uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: uv
      - name: Validate Hermes distribution metadata
        shell: bash
        run: |
          wheel_dir=$(mktemp -d)
          [ -n "$wheel_dir" ] && [ -d "$wheel_dir" ]
          uv build --wheel --out-dir "$wheel_dir" plugin/.hermes/package
          wheels=("$wheel_dir"/*.whl)
          [ "${#wheels[@]}" -eq 1 ] && [ -f "${wheels[0]}" ]
          uvx --from twine==7.0.0 --with packaging==26.3 twine check --strict "${wheels[0]}"
      - name: Verify Hermes discovery and tool calls
        run: uv run --no-project --python 3.11 --with mcp==1.28.1 --with PyYAML==6.0.3 python scripts/tests/test_hermes_plugin.py

      - name: Verify public skills and export ownership
        run: |
          python3 scripts/tests/test_public_skills.py
          python3 scripts/sync_public_skills.py --check
