[build-system]
requires = ['hatchling>=1.27']
build-backend = 'hatchling.build'

[project]
name = 'sceptre-hermes-plugin'
version = '0.10.0'
description = 'Local OCR with CRAFT detection and multilingual CRNN recognition.'
license = 'MIT'
requires-python = '>=3.11'
dependencies = ['mcp==1.28.1', 'PyYAML==6.0.3']
keywords = ['ocr', 'images', 'text-recognition', 'mcp']

[project.readme]
content-type = 'text/markdown'
text = "# sceptre Hermes plugin\n\nLocal OCR with CRAFT detection and multilingual CRNN recognition.\n\nInstall this package in the same Python environment as Hermes Agent:\n\n```sh\npython -m pip install sceptre-hermes-plugin\n```\n\nEnable the plugin through Hermes Agent's plugin configuration. Available registrations depend on the plugin's authored Hermes adapter.\n"

[project.entry-points]
[project.entry-points.'hermes_agent.plugins']
sceptre = 'sceptre_hermes_plugin'

[project.urls]
Homepage = 'https://xberg.io'
Repository = 'https://github.com/xberg-io/sceptre'

[tool]
[tool.hatch]
[tool.hatch.build]
[tool.hatch.build.targets]
[tool.hatch.build.targets.wheel]
packages = ['src/sceptre_hermes_plugin']
