version: "3"

includes:
  rust:
    taskfile: ./.task/rust.yml
  python:
    taskfile: ./.task/python.yml
  tools:
    taskfile: ./.task/tools.yml
  docs:
    taskfile: ./.task/docs.yml

vars:
  # Tasks and CI run the latest ai-rulez release; hooks use the one on PATH, which must be at least this. ~keep
  AI_RULEZ_MIN_VERSION: "5.7.0"
  AI_RULEZ: "uvx ai-rulez@latest"

tasks:
  version:set:
    desc: Set the workspace and plugin versions, then regenerate plugin bundles
    preconditions:
      - sh: test -n '{{.CLI_ARGS}}'
        msg: 'Pass a version: task version:set -- X.Y.Z'
    cmds:
      - cargo set-version --workspace {{.CLI_ARGS}}
      - python3 scripts/sync_plugin_version.py
      - task: plugin:generate
      - python3 scripts/sync_plugin_version.py --check

  setup:
    desc: Fetch Rust dependencies, install git hooks, sync the Python dev environment, and fetch the test corpus
    cmds:
      - cargo fetch
      - task: governance:hooks:install
      - uv sync
      - git submodule update --init --recursive test_documents
      - python3 test_documents/scripts/fetch_corpus.py --include 'images/**'

  build:
    desc: Build the Rust workspace
    cmds:
      - task: rust:build

  test:
    desc: Run the Rust workspace test suite
    cmds:
      - task: rust:test

  bench:
    desc: Run the criterion microbenchmarks for the sceptre hot paths
    cmds:
      - task: rust:bench

  lint:
    desc: Lint Rust (poly) and Python (ruff) code
    cmds:
      - poly lint .
      - task: python:lint

  format:
    desc: Format Rust (cargo fmt) and Python (ruff) code
    cmds:
      - task: rust:fmt
      - task: python:format

  check:
    desc: Full pre-commit gate (fmt check + clippy + feature matrix + test + poly lint)
    cmds:
      - task: rust:check
      - poly lint .

  update:
    desc: Bump dependencies to latest compatible versions (cargo update + uv lock --upgrade)
    cmds:
      - cargo update
      - uv lock --upgrade

  upgrade:
    desc: Bump dependencies to latest, including breaking changes
    cmds:
      # cargo upgrade comes from cargo-edit (cargo install cargo-edit --locked); it is not
      # part of stock cargo. ~keep
      - cargo upgrade --incompatible
      - uv lock --upgrade

  release:build:
    desc: Build the release CLI binary (bundled ONNX Runtime) for the current platform
    cmds:
      - task: rust:release:build

  release:package:
    desc: Build and archive the self-contained release CLI binary for TRIPLE (e.g. TRIPLE=x86_64-apple-darwin)
    cmds:
      - task: rust:release:package
        vars:
          TRIPLE: "{{.TRIPLE}}"

  release:dry-run:
    desc: Validate that the sceptre library packages cleanly for crates.io, without publishing
    cmds:
      - task: rust:release:dry-run

  clean:
    desc: Remove Rust build artifacts
    cmds:
      - cargo clean

  governance:hooks:install:
    desc: Provision machine preferences and install reviewed AI governance hooks
    cmds:
      - |
        python3 - <<'PYTHON'
        import pathlib
        import re
        import shutil
        import subprocess
        import tomllib

        wanted = "{{.AI_RULEZ_MIN_VERSION}}"
        upgrade = "uv tool install --upgrade ai-rulez"
        found = shutil.which("ai-rulez")
        if found is None:
            raise SystemExit("Install ai-rulez " + wanted + " or newer before installing hooks: " + upgrade)
        version = subprocess.run([found, "--version"], capture_output=True, text=True, check=True).stdout.split()[-1]
        parsed = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", version)
        if parsed is None:
            raise SystemExit("Hooks need an ai-rulez X.Y.Z release, not a prerelease; found " + version + ": " + upgrade)
        if tuple(map(int, parsed.groups())) < tuple(map(int, wanted.split("."))):
            raise SystemExit("Hooks need ai-rulez " + wanted + " or newer, found " + version + ": " + upgrade)
        preferences = pathlib.Path("poly.local.toml")
        text = preferences.read_text() if preferences.exists() else ""
        data = tomllib.loads(text)
        if "hook_preferences" not in data:
            preferences.write_text(text.rstrip() + '\n\n[hook_preferences]\nchannels = ["system"]\n')
        elif "system" not in data["hook_preferences"].get("channels", []):
            raise SystemExit("Add system to hook_preferences.channels in poly.local.toml")
        subprocess.run(["poly", "hooks", "install"], check=True)
        PYTHON

  plugin:hermes:test:
    desc: Verify the Hermes bridge against a real MCP stdio fixture
    cmds:
      - uv run --no-project --python 3.11 --with mcp==1.28.1 --with PyYAML==6.0.3 python scripts/tests/test_hermes_plugin.py

  governance:check:
    desc: Check materialized local governance outputs against shared sources
    cmds:
      - "{{.AI_RULEZ}} generate --check --no-local --strict-config"

  plugin:skills:test:
    desc: Verify public skill ownership and resource freshness
    cmds:
      - python3 scripts/tests/test_public_skills.py
      - python3 scripts/sync_public_skills.py --check

  plugin:generate:
    desc: Generate all native plugin bundles and public skills
    cmds:
      - "{{.AI_RULEZ}} generate --plugin"
      - python3 scripts/sync_public_skills.py

  plugin:verify:
    desc: Verify native plugin bundles and public skills
    cmds:
      - "{{.AI_RULEZ}} verify --plugin"
      - python3 scripts/sync_public_skills.py --check

  release:verify:published:
    desc: Verify an existing published native archive through checksum, MCP and real OCR checks
    vars:
      VERSION: '{{.VERSION | default .RELEASE_VERSION}}'
      TRIPLE: '{{.TRIPLE | default .RELEASE_TRIPLE}}'
      OUTPUT: '{{.OUTPUT | default .RELEASE_OUTPUT | default "dist/published-runtime-proof"}}'
      MODEL_CACHE: '{{.MODEL_CACHE | default .RELEASE_MODEL_CACHE | default "dist/published-runtime-models"}}'
    requires:
      vars: [VERSION, TRIPLE]
    env:
      VERIFY_RELEASE_VERSION: '{{.VERSION}}'
      VERIFY_RELEASE_TRIPLE: '{{.TRIPLE}}'
      VERIFY_RELEASE_OUTPUT: '{{.OUTPUT}}'
      VERIFY_RELEASE_MODEL_CACHE: '{{.MODEL_CACHE}}'
    cmds:
      - python3 scripts/verify_published_release.py

  release:verify:test:
    desc: Test published runtime verification against checksum, protocol and OCR failure controls
    cmds:
      - python3 scripts/tests/test_published_release.py
