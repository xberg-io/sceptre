[defaults]
line_length = 120
line_ending = "lf"
final_newline = true
trim_trailing_whitespace = true

[discovery]
exclude = [
  "**/*.lock",
  "**/Cargo.lock",
  "**/*.onnx",
  # Brand/asset SVGs are hand-tuned; poly must not reflow them. ~keep
  "**/*.svg",
  "target/**",
  "dist/**",
  "node_modules/**",
  "vendor/**",
  "**/assets/**",
  "**/tests/data/**",
  "docs-site/dist/**",
  "docs-site/node_modules/**",
  "docs-site/.astro/**",
  # test_documents is a git submodule (a separate shared corpus repo) whose files are
  # deliberately malformed extraction fixtures. poly must never rewrite them. ~keep
  "test_documents/**",
  "**/pnpm-lock.yaml",
]

[lint.markdown.rumdl]
disable = ["MD012", "MD013", "MD024", "MD033", "MD036", "MD041", "MD046", "MD051", "MD076"]

# MD025 stays enabled for lint but disabled for fmt: rumdl's autofix for a second
# level-1 heading demotes every heading that follows it, which silently reparents a
# whole CHANGELOG under [Unreleased] and breaks release-note extraction. ~keep
[fmt.markdown.rumdl]
disable = ["MD012", "MD013", "MD024", "MD033", "MD036", "MD041", "MD046", "MD051", "MD076", "MD025"]

[tools.actionlint]
enabled = true

[lint.uncomment]
enabled = true
code_only = false
remove_todos = false
remove_fixme = false
remove_docs = false
use_default_ignores = true
preserve_patterns = [
  "SAFETY",
  "HACK",
  "WORKAROUND",
  "NOTE",
  "Copyright",
  "Licensed",
  "License",
  "SPDX",
  "Apache",
  "MIT",
  "WITHOUT WARRANTIES",
  "limitations under the License",
  "copyright",
  "licensed",
  "license",
  "apache",
  "you may not use this file except in compliance",
  "You may obtain a copy of the License",
  "you may obtain a copy of the license",
  "Unless required by applicable law",
  "unless required by applicable law",
  "distributed under the License",
  "distributed under the license",
  "AS IS",
  "as is",
  "without warranties",
  "specific language governing permissions",
  "limitations under the license",
]

[per-file-ignores]
# --- quality-debt baseline (generated) ---
# 10 size/complexity findings across 3 files that predate these
# metrics. Listed per file rather than switching the rules off, so the metrics still
# fire on every file NOT listed here -- new code stays covered, and each path below is
# one discrete unit of work.
# TODO(quality-debt): pay this down file by file and delete each entry as it goes green.
# Do not add new paths here without a very good reason. ~keep
"crates/sceptre/src/detect/postprocess.rs" = ["nesting-too-deep", "too-many-parameters"]
"crates/sceptre/src/engine/sceptre_engine.rs" = ["function-too-long"]
# --- end quality-debt baseline ---
# Quality metrics do not apply to test code. A test function's length is its assertion
# count and a table-driven test's arity mirrors its cases; splitting either to satisfy a
# production-code maintainability metric makes the test harder to read, not easier. Only
# `file-too-long` and `type-too-long` still apply here -- an oversized test FILE is a real
# organisational problem, unlike an oversized test function. ~keep
"**/tests/**/*" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/test/**/*" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/benches/**/*" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*_test.rs" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*_tests.rs" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/test_*.py" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*_test.py" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/conftest.py" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*.test.ts" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*.test.js" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*.test.mjs" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*.spec.ts" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*.spec.js" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*_test.go" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*Test.java" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*Tests.cs" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*_test.dart" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*_spec.rb" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
# Stylistic rules disabled repo-wide. Each is a formatting or idiom preference with no
# correctness or security consequence, and each fires in volumes no one can hand-maintain
# (`require-unicode-regexp` alone was 724 across the polyrepo, `no-inline-comments` 200).
# `eqeqeq` is here for a stronger reason: every occurrence audited was the deliberate
# `== null` nullish idiom, so the rule had a 100% false-positive rate here.
# Rules with a real correctness or security angle are deliberately NOT listed and stay on:
# unicorn/require-post-message-target-origin, unicorn/no-array-callback-reference,
# unicorn/no-immediate-mutation, unicorn/no-array-fill-with-reference-type. ~keep
"**" = [
  "CPY001",
  "UnorderedKey",
  "eqeqeq",
  "no-inline-comments",
  "no-negated-condition",
  "require-unicode-regexp",
  "unicorn/consistent-function-scoping",
  "unicorn/escape-case",
  "unicorn/explicit-length-check",
  "unicorn/new-for-builtins",
  "unicorn/no-array-sort",
  "unicorn/no-hex-escape",
  "unicorn/no-lonely-if",
  "unicorn/no-negated-condition",
  "unicorn/no-typeof-undefined",
  "unicorn/no-useless-undefined",
  "unicorn/prefer-add-event-listener",
  "unicorn/prefer-at",
  "unicorn/prefer-code-point",
  "unicorn/prefer-dom-node-append",
  "unicorn/prefer-dom-node-remove",
  "unicorn/prefer-import-meta-properties",
  "unicorn/prefer-native-coercion-functions",
  "unicorn/prefer-number-coercion",
  "unicorn/prefer-query-selector",
  "unicorn/prefer-single-call",
  "unicorn/prefer-string-replace-all",
  "unicorn/prefer-string-slice",
  "unicorn/prefer-top-level-await",
  "unicorn/prefer-type-error",
  "unicorn/require-module-specifiers",
]
"basemind.toml" = ["comment", "doc-comment"]
"**/*.generated.*" = ["comment", "doc-comment"]
# Python uses `#` comments idiomatically; the uncomment hook targets Rust/TOML. ~keep
"python/**" = ["comment", "doc-comment"]
# T201 (`print` found): every module below is an argparse CLI entry point run as
# `python -m sceptre_rs_tools.<name>`, and its stdout/stderr writing IS the product —
# the aggregated Markdown table, the export summary, the drift-check verdict, the
# per-batch progress. The package installs no logging subscriber and has no logger to
# route through, so `print` is the output channel, not a stray debugging statement.
# Library modules in the same package (corpus, stats, text_metrics) are deliberately
# NOT listed and keep T201 on. ~keep
"python/sceptre_rs_tools/backend_matrix.py" = ["T201"]
"python/sceptre_rs_tools/benchmark.py" = ["C901", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "T201", "file-too-long", "function-too-long"]
"python/sceptre_rs_tools/export.py" = ["T201"]
"python/sceptre_rs_tools/golden.py" = ["T201"]
"python/sceptre_rs_tools/publish.py" = ["T201"]
"python/sceptre_rs_tools/rasterize.py" = ["T201"]
# The docs site is JS/CSS/MDX; comments there are idiomatic, not stray Rust/TOML cruft. ~keep
"docs-site/**" = ["comment", "doc-comment"]

[hooks]
stages = ["pre-commit"]

[hooks.builtin]
lint = { exclude = [
  "**/*.lock",
  "**/*.onnx",
  "**/*.svg",
  "target/**",
  "**/assets/**",
  "**/tests/data/**",
  "docs-site/dist/**",
  "docs-site/node_modules/**",
  "docs-site/.astro/**",
  # test_documents is a git submodule (a separate shared corpus repo) whose files are
  # deliberately malformed extraction fixtures. poly must never rewrite them. ~keep
  "test_documents/**",
  "**/pnpm-lock.yaml",
] }
fmt = { exclude = [
  "**/*.lock",
  "**/*.onnx",
  "**/*.svg",
  "target/**",
  "**/assets/**",
  "**/tests/data/**",
  "docs-site/dist/**",
  "docs-site/node_modules/**",
  "docs-site/.astro/**",
  # test_documents is a git submodule (a separate shared corpus repo) whose files are
  # deliberately malformed extraction fixtures. poly must never rewrite them. ~keep
  "test_documents/**",
  "**/pnpm-lock.yaml",
] }
commit = { stages = ["commit-msg"] }
file_safety = { exclude = [
  "**/*.lock",
  "**/*.onnx",
  "**/*.svg",
  "target/**",
  "**/assets/**",
  "**/tests/data/**",
  "docs-site/dist/**",
  "docs-site/node_modules/**",
  "docs-site/.astro/**",
  # test_documents is a git submodule (a separate shared corpus repo) whose files are
  # deliberately malformed extraction fixtures. poly must never rewrite them. ~keep
  "test_documents/**",
  "**/pnpm-lock.yaml",
] }
cargo = true

[[hooks.sources]]
id = "ai-rulez"
git = "https://github.com/Goldziher/ai-rulez.git"
revision = "v4.9.3"
hooks = ["ai-rulez-validate", "ai-rulez-plugin-verify"]
