version = "5.0"
default_layers = ["plugins"]
name = "sceptre"
description = "Rust reimplementation of EasyOCR — CRAFT detection + gen2 CRNN recognition over ONNX, as a library + CLI + MCP server."
gitignore = true

presets = ["claude", "codex", "opencode", "pi", "hermes", "gemini", "copilot"]

compact = true
builtins = ["!agent-delegation", "!git-workflow", "documentation", "default-commands"]

[header]
style = "minimal"


[[includes]]
name = "xberg-core"
source = 'https://github.com/xberg-io/agent-conventions.git'
ref = "757ee401a9406f39fb266f5482cdd014a38c9313"
path = "modules/core"
merge_strategy = "local-override"

[[includes]]
name = "xberg-languages"
source = 'https://github.com/xberg-io/agent-conventions.git'
ref = "757ee401a9406f39fb266f5482cdd014a38c9313"
path = "modules/languages"
merge_strategy = "local-override"

[[includes]]
name = "xberg-cicd"
source = 'https://github.com/xberg-io/agent-conventions.git'
ref = "757ee401a9406f39fb266f5482cdd014a38c9313"
path = "modules/cicd"
merge_strategy = "local-override"

[[mcp_servers]]
name = "ai-rulez"
description = "Manage AI governance config via MCP."
command = "ai-rulez"
args = ["mcp"]

[defaults]
effort = "medium"

[mcp]
self_server_command = ["ai-rulez", "mcp"]


[codex]
project_doc_max_bytes = 65536

[lock]
include_outputs = false

# Goldziher/ai-rulez#485: ai-rulez reports generated skill copies as duplicates. ~keep
[[lint.ignore_rules]]
rules = ["AR701"]
paths = [
  "plugin/.cursor-plugin/skills/*/SKILL.md",
  "plugin/.hermes/package/src/sceptre_hermes_plugin/skills/*/SKILL.md",
  "plugin/.hermes/plugins/sceptre/skills/*/SKILL.md",
  "plugin/.opencode/skills/*/SKILL.md",
  "plugin/.pi/skills/*/SKILL.md",
  "plugin/skills/*/SKILL.md",
  "skills/*/SKILL.md",
]
reason = "The generated harness and plugin copies repeat the source skill descriptions and names. ai-rulez counts each copy as a duplicate."

[rules]
# ~keep Glob-scoped rules stay out of AGENTS.md: rule files for Claude, path-gated skills for Codex.
scoped_fallback = "skill"
