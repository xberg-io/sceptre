version = "5.0"
default_layers = ["plugins"]
name = "sceptre"
description = "Rust reimplementation of EasyOCR — CRAFT detection + gen2 CRNN recognition over ONNX, as a library + CLI + MCP server."
gitignore = true

presets = ["claude", "codex", "opencode"]

compact = true
# ~keep adr-immutability and adr-workflow are dropped for the local adr-discipline rule (adrs/**).
# ~keep readme-standards is always-on for a README that already exists.
builtins = [
  "!agent-delegation",
  "!ai-governance/agent-workflow",
  "!git-workflow",
  "!testing/test-alongside-code",
  "!testing/tdd-workflow",
  "!token-efficiency/output-awareness",
  "!token-efficiency/task-runner",
  "!ai-governance/explain-reasoning",
  "!security/least-privilege",
  "!security/input-validation",
  "documentation",
  "!documentation/adr-immutability",
  "!documentation/adr-workflow",
  "!documentation/readme-standards",
  "default-commands",
]

[header]
style = "minimal"


[[includes]]
name = "xberg-core"
source = 'https://github.com/xberg-io/agent-conventions.git'
version = "^1"
path = "modules/core"
merge_strategy = "local-override"

[[includes]]
name = "xberg-languages"
source = 'https://github.com/xberg-io/agent-conventions.git'
version = "^1"
path = "modules/languages"
merge_strategy = "local-override"

[[includes]]
name = "xberg-cicd"
source = 'https://github.com/xberg-io/agent-conventions.git'
version = "^1"
path = "modules/cicd"
merge_strategy = "local-override"

[[includes]]
name = "xberg-docs-sites"
source = 'https://github.com/xberg-io/agent-conventions.git'
version = "^1"
path = "modules/docs-sites"
merge_strategy = "local-override"

[defaults]
effort = "medium"

[mcp]
self_server_command = ["ai-rulez", "mcp"]
# ~keep Skill discovery only: the full server lists 67 tools (~38k tokens of schema) at every session start.
serve_skills = true
read_only = true
discover_skills = "repo"
tools = ["find_skill", "load_skill"]


[codex]
project_doc_max_bytes = 65536

[lock]
include_outputs = false

[lint]
# ~keep Generated plugin bundle copies, checked through plugin/.ai-rulez and verify --plugin. Codex never lists them,
# but AR964 counts every tracked SKILL.md copy toward its skill listing.
ignore_paths = [
  "plugin/.cursor-plugin/**",
  "plugin/.hermes/**",
  "plugin/.opencode/**",
  "plugin/.pi/**",
  "plugin/skills/**",
]

# Goldziher/ai-rulez#485: ai-rulez reports generated skill copies as duplicates. ~keep
[[lint.ignore_rules]]
rules = ["AR701"]
paths = [
  "plugin/.cursor-plugin/skills/*/SKILL.md",
  "plugin/.hermes/package/src/sceptre_hermes_plugin/skills/*/SKILL.md",
  "plugin/.hermes/plugins/sceptre/skills/*/SKILL.md",
  "plugin/.opencode/skills/*/SKILL.md",
  "plugin/.pi/skills/*/SKILL.md",
  "plugin/skills/*/SKILL.md",
  "skills/*/SKILL.md",
]
reason = "The generated harness and plugin copies repeat the source skill descriptions and names. ai-rulez counts each copy as a duplicate."

[rules]
# ~keep Glob-scoped rules stay out of AGENTS.md: rule files for Claude, path-gated skills for Codex.
scoped_fallback = "skill"
# ~keep One path-gated skill per directory keeps the Codex skill listing under its budget (AR964).
scoped_fallback_group = "directory"
